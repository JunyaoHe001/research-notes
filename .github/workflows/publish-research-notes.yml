name: Publish Research Notes

on:
  push:
    branches: [v5]
  pull_request:
    branches: [v5]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: research-notes-pages-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out website source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm

      - name: Configure GitHub Pages
        if: github.event_name != 'pull_request'
        uses: actions/configure-pages@v5

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Validate Pages CMS data and interactive-map screenshots
        run: |
          node --input-type=module <<'NODE'
          import fs from "node:fs"
          import path from "node:path"
          import YAML from "yaml"

          YAML.parse(fs.readFileSync(".pages.yml", "utf8"))

          const sourceFile = "quartz/static/interactive-maps.json"
          const entries = JSON.parse(fs.readFileSync(sourceFile, "utf8"))
          if (!Array.isArray(entries)) throw new Error(`${sourceFile} must contain an array`)

          for (const entry of entries.filter((item) => item && item.showOnResearch !== false)) {
            if (!entry.title || !entry.externalLink || !entry.screenshot) {
              throw new Error(`Incomplete interactive-map entry: ${JSON.stringify(entry)}`)
            }

            const screenshotPath = String(entry.screenshot).split("?", 1)[0]
            const sitePrefix = "/research-notes/"
            const relativePath = screenshotPath.startsWith(sitePrefix)
              ? screenshotPath.slice(sitePrefix.length)
              : screenshotPath.replace(/^\/+/, "")
            const localPath = path.join("quartz", relativePath)

            if (!fs.existsSync(localPath)) {
              throw new Error(`Screenshot is missing for ${entry.title}: ${localPath}`)
            }
          }

          const yearMonthPattern = /^[0-9]{4}-(0[1-9]|1[0-2])$/
          for (const collection of ["publications", "working-papers"]) {
            const directory = path.join("content", collection)
            const files = fs
              .readdirSync(directory)
              .filter((file) => file.endsWith(".md") && file !== "index.md")

            for (const file of files) {
              const filePath = path.join(directory, file)
              const source = fs.readFileSync(filePath, "utf8")
              const match = source.match(/^---\r?\n([\s\S]*?)\r?\n---(?:\r?\n|$)/)
              if (!match) throw new Error(`Missing YAML frontmatter in ${filePath}`)
              const data = YAML.parse(match[1]) ?? {}
              const yearMonth = String(data["year-month"] ?? "").trim()
              if (!yearMonthPattern.test(yearMonth)) {
                throw new Error(`Invalid year-month in ${filePath}: ${yearMonth || "missing"}`)
              }
            }
          }

          console.log(`Validated ${entries.length} interactive-map entries and all research-output year-month fields.`)
          NODE

      - name: Synchronize generated content
        run: |
          node scripts/sync-content-indexes.mjs
          node scripts/sync-research-output-months.mjs
          node scripts/format-activity-months.mjs
          node scripts/sync-graph-settings.mjs
          grep -F '| Year–Month |' content/publications/index.md
          grep -F '| Year–Month |' content/working-papers/index.md

      - name: Build Quartz website
        run: npx quartz build

      - name: Generate tag-network data
        run: node scripts/build-tag-network-data.mjs

      - name: Validate built interactive-map assets and research-output pages
        run: |
          node --input-type=module <<'NODE'
          import fs from "node:fs"
          import path from "node:path"

          const builtData = "public/static/interactive-maps.json"
          if (!fs.existsSync(builtData)) throw new Error(`${builtData} was not generated`)

          const entries = JSON.parse(fs.readFileSync(builtData, "utf8"))
          for (const entry of entries.filter((item) => item && item.showOnResearch !== false)) {
            const screenshotPath = String(entry.screenshot).split("?", 1)[0]
            const sitePrefix = "/research-notes/"
            const relativePath = screenshotPath.startsWith(sitePrefix)
              ? screenshotPath.slice(sitePrefix.length)
              : screenshotPath.replace(/^\/+/, "")
            const publicPath = path.join("public", relativePath)

            if (!fs.existsSync(publicPath)) {
              throw new Error(`Built screenshot is missing for ${entry.title}: ${publicPath}`)
            }
          }

          for (const pagePath of ["public/publications/index.html", "public/working-papers/index.html"]) {
            if (!fs.existsSync(pagePath)) throw new Error(`Built page is missing: ${pagePath}`)
            const html = fs.readFileSync(pagePath, "utf8")
            if (!html.includes("Year–Month")) throw new Error(`Year–Month heading is missing in ${pagePath}`)
          }

          console.log("Built interactive-map assets and year-month research-output pages are complete.")
          NODE

      - name: Upload GitHub Pages artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v4
        with:
          path: public

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy website
        id: deployment
        uses: actions/deploy-pages@v4
