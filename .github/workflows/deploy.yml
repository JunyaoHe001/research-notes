name: Deploy Research Notes

on:
  push:
    branches: [v5]
  workflow_dispatch:
  issues:
    types: [opened]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: research-notes-pages
  cancel-in-progress: true

jobs:
  build:
    if: github.event_name != 'issues' || github.event.issue.title == '[deploy] Research Notes'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out v5
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .node-version
          cache: npm

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Validate Pages CMS configuration
        run: node --input-type=module -e 'import fs from "node:fs"; import YAML from "yaml"; YAML.parse(fs.readFileSync(".pages.yml", "utf8")); console.log("Pages CMS configuration is valid YAML.")'

      - name: Validate interactive-map screenshot
        run: |
          node --input-type=module <<'NODE'
          import fs from "node:fs"
          const entries = JSON.parse(fs.readFileSync("quartz/static/interactive-maps.json", "utf8"))
          const entry = entries.find((item) => item.title === "Dutch Municipal Job–Home Networks")
          if (!entry) throw new Error("Dutch job-home card is missing")
          if (entry.screenshot !== "/research-notes/static/interactive-maps/nl-job-home-2-1.png?v=20260826-2") {
            throw new Error(`Unexpected screenshot reference: ${entry.screenshot}`)
          }
          if (!fs.existsSync("quartz/static/interactive-maps/nl-job-home-2-1.png")) {
            throw new Error("Refreshed Dutch job-home screenshot file is missing")
          }
          console.log("Interactive-map screenshot source is valid.")
          NODE

      - name: Synchronize generated content
        run: |
          node scripts/sync-content-indexes.mjs
          node scripts/format-activity-months.mjs
          node scripts/sync-graph-settings.mjs

      - name: Build Quartz site
        run: npx quartz build

      - name: Generate tag-network data
        run: node scripts/build-tag-network-data.mjs

      - name: Validate built screenshot and card data
        run: |
          test -f public/static/interactive-maps/nl-job-home-2-1.png
          grep -F 'nl-job-home-2-1.png?v=20260826-2' public/static/interactive-maps.json

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
