name: Deploy Quartz site to GitHub Pages

on:
  push:
    branches:
      - v5
  pull_request:
    branches:
      - v5
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages-recovery-v3-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Clear stale Pages deployment
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          STALE_DEPLOYMENT_ID: 4156dfa546187fcf41c72ce4bf22fb720981b42e
        run: |
          set -euo pipefail

          api_url="https://api.github.com/repos/${GITHUB_REPOSITORY}/pages/deployments/${STALE_DEPLOYMENT_ID}"
          http_status="$(curl --silent --show-error --output /tmp/pages-cancel-response --write-out '%{http_code}' \
            --request POST \
            --header 'Accept: application/vnd.github+json' \
            --header "Authorization: Bearer ${GH_TOKEN}" \
            --header 'X-GitHub-Api-Version: 2022-11-28' \
            "${api_url}/cancel")"

          case "${http_status}" in
            200|202|204)
              echo "Cancellation requested for stale Pages deployment ${STALE_DEPLOYMENT_ID}."
              ;;
            404)
              echo "Stale Pages deployment is already absent."
              ;;
            *)
              echo "Cancellation request returned HTTP ${http_status}. Checking the current deployment state."
              cat /tmp/pages-cancel-response || true
              ;;
          esac

          current_state="unknown"
          for attempt in $(seq 1 24); do
            response="$(curl --silent --show-error \
              --header 'Accept: application/vnd.github+json' \
              --header "Authorization: Bearer ${GH_TOKEN}" \
              --header 'X-GitHub-Api-Version: 2022-11-28' \
              "${api_url}")"
            current_state="$(printf '%s' "${response}" | python3 -c 'import json, sys; print(json.load(sys.stdin).get("status", "unknown"))' 2>/dev/null || echo unknown)"
            echo "Stale deployment state: ${current_state} (check ${attempt}/24)"

            case "${current_state}" in
              deployment_in_progress|deployment_queued|in_progress|queued)
                sleep 5
                ;;
              *)
                break
                ;;
            esac
          done

          case "${current_state}" in
            deployment_in_progress|deployment_queued|in_progress|queued)
              echo "The stale Pages deployment remains locked after the cancellation request."
              exit 1
              ;;
            *)
              echo "The stale Pages deployment no longer blocks publication."
              ;;
          esac

      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Configure GitHub Pages
        if: github.event_name != 'pull_request'
        uses: actions/configure-pages@v5

      - name: Install dependencies
        run: npm ci

      - name: Validate Pages CMS configuration
        run: node --input-type=module -e 'import fs from "node:fs"; import YAML from "yaml"; YAML.parse(fs.readFileSync(".pages.yml", "utf8")); console.log("Pages CMS configuration is valid YAML.")'

      - name: Synchronize generated content indexes
        run: node scripts/sync-content-indexes.mjs

      - name: Format activity dates by month
        run: node scripts/format-activity-months.mjs

      - name: Synchronize tag network settings
        run: node scripts/sync-graph-settings.mjs

      - name: Commit synchronized files
        if: github.event_name == 'push' && github.ref == 'refs/heads/v5'
        run: |
          GENERATED_FILES=(
            content/index.md
            content/publications/index.md
            content/working-papers/index.md
            content/activities/index.md
            content/teaching/index.md
            content/projects/index.md
            content/methods/index.md
            quartz/graph-settings.generated.ts
          )

          if git diff --quiet -- "${GENERATED_FILES[@]}"; then
            echo "Generated files are already synchronized."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "418982418+github-actions[bot]@users.noreply.github.com"
          git add "${GENERATED_FILES[@]}"
          git commit -m "content: synchronize generated site files"
          git push origin HEAD:v5

      - name: Build Quartz
        run: npx quartz build

      - name: Generate tag network data
        run: node scripts/build-tag-network-data.mjs

      - name: Upload preview artifact
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: quartz-preview
          path: public
          retention-days: 3

      - name: Upload Pages artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v4
        with:
          path: public

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
