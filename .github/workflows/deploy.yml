name: Deploy Quartz site to GitHub Pages

on:
  push:
    branches:
      - v5
  pull_request:
    branches:
      - v5
  workflow_dispatch:

permissions:
  contents: write
  deployments: write
  pages: write
  id-token: write

concurrency:
  group: pages-recovery-v4-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Recover GitHub Pages state
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          STALE_PAGES_DEPLOYMENT_ID: 4156dfa546187fcf41c72ce4bf22fb720981b42e
          STALE_GITHUB_DEPLOYMENT_IDS: "5780876401 5780695143"
        run: |
          set -euo pipefail

          api_version="2026-03-10"
          repository_api="https://api.github.com/repos/${GITHUB_REPOSITORY}"
          pages_deployment_api="${repository_api}/pages/deployments/${STALE_PAGES_DEPLOYMENT_ID}"

          echo "Marking stale GitHub deployments inactive."
          for deployment_id in ${STALE_GITHUB_DEPLOYMENT_IDS}; do
            status_code="$(curl --silent --show-error --output "/tmp/deployment-${deployment_id}-response" --write-out '%{http_code}' \
              --request POST \
              --header 'Accept: application/vnd.github+json' \
              --header "Authorization: Bearer ${GH_TOKEN}" \
              --header "X-GitHub-Api-Version: ${api_version}" \
              "${repository_api}/deployments/${deployment_id}/statuses" \
              --data '{"state":"inactive","description":"Cleared before GitHub Pages recovery","environment":"github-pages","auto_inactive":false}')"

            if [[ "${status_code}" == "201" ]]; then
              echo "Deployment ${deployment_id} is now inactive."
            else
              echo "Deployment ${deployment_id} status update returned HTTP ${status_code}."
              cat "/tmp/deployment-${deployment_id}-response" || true
            fi
          done

          echo "Requesting cancellation of the stale Pages deployment."
          cancel_status="$(curl --silent --show-error --output /tmp/pages-cancel-response --write-out '%{http_code}' \
            --request POST \
            --header 'Accept: application/vnd.github+json' \
            --header "Authorization: Bearer ${GH_TOKEN}" \
            --header "X-GitHub-Api-Version: ${api_version}" \
            "${pages_deployment_api}/cancel")"
          echo "Pages cancellation request returned HTTP ${cancel_status}."
          cat /tmp/pages-cancel-response || true

          get_pages_deployment_state() {
            local response_file="/tmp/pages-deployment-state"
            local status_code
            status_code="$(curl --silent --show-error --output "${response_file}" --write-out '%{http_code}' \
              --header 'Accept: application/vnd.github+json' \
              --header "Authorization: Bearer ${GH_TOKEN}" \
              --header "X-GitHub-Api-Version: ${api_version}" \
              "${pages_deployment_api}")"

            if [[ "${status_code}" == "404" ]]; then
              echo "absent"
              return
            fi

            python3 - "${response_file}" <<'PY'
          import json
          import pathlib
          import sys

          path = pathlib.Path(sys.argv[1])
          try:
              print(json.loads(path.read_text()).get("status", "unknown"))
          except Exception:
              print("unknown")
          PY
          }

          current_state="unknown"
          for attempt in $(seq 1 18); do
            current_state="$(get_pages_deployment_state)"
            echo "Stale Pages deployment state: ${current_state} (check ${attempt}/18)"
            case "${current_state}" in
              deployment_in_progress|deployment_queued|in_progress|queued)
                sleep 5
                ;;
              *)
                break
                ;;
            esac
          done

          case "${current_state}" in
            deployment_in_progress|deployment_queued|in_progress|queued)
              echo "Cancellation did not clear the lock. Attempting a complete Pages site reset."

              delete_status="$(curl --silent --show-error --output /tmp/pages-delete-response --write-out '%{http_code}' \
                --request DELETE \
                --header 'Accept: application/vnd.github+json' \
                --header "Authorization: Bearer ${GH_TOKEN}" \
                --header "X-GitHub-Api-Version: ${api_version}" \
                "${repository_api}/pages")"
              echo "Pages deletion returned HTTP ${delete_status}."
              cat /tmp/pages-delete-response || true

              if [[ "${delete_status}" != "204" && "${delete_status}" != "404" ]]; then
                echo "The Pages site could not be reset with the workflow token."
                exit 1
              fi

              for attempt in $(seq 1 18); do
                site_status="$(curl --silent --show-error --output /tmp/pages-site-response --write-out '%{http_code}' \
                  --header 'Accept: application/vnd.github+json' \
                  --header "Authorization: Bearer ${GH_TOKEN}" \
                  --header "X-GitHub-Api-Version: ${api_version}" \
                  "${repository_api}/pages")"
                echo "Pages site removal status: HTTP ${site_status} (check ${attempt}/18)"
                [[ "${site_status}" == "404" ]] && break
                sleep 5
              done

              create_status="$(curl --silent --show-error --output /tmp/pages-create-response --write-out '%{http_code}' \
                --request POST \
                --header 'Accept: application/vnd.github+json' \
                --header "Authorization: Bearer ${GH_TOKEN}" \
                --header 'Content-Type: application/json' \
                --header "X-GitHub-Api-Version: ${api_version}" \
                "${repository_api}/pages" \
                --data '{"build_type":"workflow"}')"
              echo "Pages recreation returned HTTP ${create_status}."
              cat /tmp/pages-create-response || true

              if [[ "${create_status}" != "201" && "${create_status}" != "409" ]]; then
                echo "The Pages site could not be recreated."
                exit 1
              fi
              ;;
            *)
              echo "The stale Pages deployment no longer blocks publication."
              ;;
          esac

      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Configure GitHub Pages
        if: github.event_name != 'pull_request'
        uses: actions/configure-pages@v5

      - name: Install dependencies
        run: npm ci

      - name: Validate Pages CMS configuration
        run: node --input-type=module -e 'import fs from "node:fs"; import YAML from "yaml"; YAML.parse(fs.readFileSync(".pages.yml", "utf8")); console.log("Pages CMS configuration is valid YAML.")'

      - name: Synchronize generated content indexes
        run: node scripts/sync-content-indexes.mjs

      - name: Format activity dates by month
        run: node scripts/format-activity-months.mjs

      - name: Synchronize tag network settings
        run: node scripts/sync-graph-settings.mjs

      - name: Commit synchronized files
        if: github.event_name == 'push' && github.ref == 'refs/heads/v5'
        run: |
          GENERATED_FILES=(
            content/index.md
            content/publications/index.md
            content/working-papers/index.md
            content/activities/index.md
            content/teaching/index.md
            content/projects/index.md
            content/methods/index.md
            quartz/graph-settings.generated.ts
          )

          if git diff --quiet -- "${GENERATED_FILES[@]}"; then
            echo "Generated files are already synchronized."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "${GENERATED_FILES[@]}"
          git commit -m "content: synchronize generated site files"
          git push origin HEAD:v5

      - name: Build Quartz
        run: npx quartz build

      - name: Generate tag network data
        run: node scripts/build-tag-network-data.mjs

      - name: Upload preview artifact
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: quartz-preview
          path: public
          retention-days: 3

      - name: Upload Pages artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v4
        with:
          path: public

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
