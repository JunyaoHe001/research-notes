name: Apply interactive maps gallery

on:
  push:
    branches: [v5]
    paths:
      - .github/workflows/apply-interactive-maps-patch.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apply-interactive-maps-gallery
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the website source branch
        uses: actions/checkout@v6
        with:
          ref: v5
          fetch-depth: 0

      - name: Apply the data-driven gallery integration
        shell: bash
        run: |
          set -euo pipefail
          git pull --ff-only origin v5
          python - <<'PY'
          from pathlib import Path

          pages_path = Path('.pages.yml')
          pages = pages_path.read_text(encoding='utf-8')

          media_block = (
              "media:\n"
              "  - name: interactive-map-images\n"
              "    label: Interactive map screenshots\n"
              "    input: quartz/static/interactive-maps\n"
              "    output: /research-notes/static/interactive-maps\n"
              "    rename: safe\n"
              "    extensions: [png, jpg, jpeg, webp]\n"
              "    categories: [image]\n\n"
          )

          if 'name: interactive-map-images' not in pages:
              pages = media_block + pages

          graph_anchor = (
              "      - name: graph-settings\n"
              "        label: Tag Network Settings\n"
              "        type: file\n"
              "        path: content/site-settings/graph.md\n"
              "        format: yaml-frontmatter\n"
              "        operations: { create: false, rename: false, delete: false }\n"
              "        fields:\n"
              "          - { name: title, label: Title, type: string, required: true }\n"
              "          - name: tag-network-enabled\n"
              "            label: Enable Tag Network\n"
              "            type: boolean\n"
              "            default: true\n"
          )

          maps_config = (
              "\n"
              "      - name: interactive-maps\n"
              "        label: Interactive Maps\n"
              "        type: file\n"
              "        path: quartz/static/interactive-maps.json\n"
              "        format: json\n"
              "        list: true\n"
              "        operations: { create: false, rename: false, delete: false }\n"
              "        fields:\n"
              "          - { name: title, label: Title, type: string, required: true }\n"
              "          - { name: subtitle, label: Subtitle or Coverage, type: string }\n"
              "          - { name: description, label: Short Description, type: text, required: true }\n"
              "          - { name: externalLink, label: Interactive Map URL, type: string, required: true }\n"
              "          - name: screenshot\n"
              "            label: Screenshot\n"
              "            type: image\n"
              "            required: true\n"
              "            options:\n"
              "              media: interactive-map-images\n"
              "              extensions: [png, jpg, jpeg, webp]\n"
              "              categories: [image]\n"
              "              rename: safe\n"
              "          - { name: imageAlt, label: Screenshot Alt Text, type: string, required: true }\n"
              "          - { name: displayOrder, label: Display Order, type: number, default: 10 }\n"
              "          - name: showOnResearch\n"
              "            label: Show on Research Page\n"
              "            type: boolean\n"
              "            default: true\n"
          )

          if 'name: interactive-maps\n' not in pages:
              if graph_anchor not in pages:
                  raise SystemExit('Could not locate the Visualisation Settings insertion point in .pages.yml')
              pages = pages.replace(graph_anchor, graph_anchor + maps_config, 1)

          pages_path.write_text(pages, encoding='utf-8')

          research_path = Path('content/research.md')
          research = research_path.read_text(encoding='utf-8')
          intro = "Five interconnected research lines organise Junyao He's work. Complex networks and complex systems provide the shared analytical foundation. The empirical questions span economic geography, urban studies, mobility and migration, planning governance, and computational social science."
          gallery = '''

          <section class="interactive-maps-section" aria-labelledby="interactive-maps-heading">
            <div class="interactive-maps-header">
              <p id="interactive-maps-heading" class="interactive-maps-heading" role="heading" aria-level="2">Interactive maps</p>
              <p class="interactive-maps-deck">Standalone visualisations linked to current research projects.</p>
            </div>
            <div class="interactive-maps-grid" data-interactive-maps-root aria-live="polite">
              <p class="interactive-maps-message">Loading interactive maps…</p>
            </div>
          </section>
          '''

          if 'data-interactive-maps-root' not in research:
              if intro not in research:
                  raise SystemExit('Could not locate the Research page introduction')
              research = research.replace(intro, intro + gallery, 1)
          research_path.write_text(research, encoding='utf-8')

          quartz_path = Path('quartz.ts')
          quartz = quartz_path.read_text(encoding='utf-8')
          import_line = 'import InteractiveMapsResources from "./quartz/components/InteractiveMapsResources"\n'
          register_line = 'componentRegistry.register("interactive-maps-resources", InteractiveMapsResources, "local")\n'
          if import_line not in quartz:
              anchor = 'import TagNetworkResources from "./quartz/components/TagNetworkResources"\n'
              if anchor not in quartz:
                  raise SystemExit('Could not locate the local component import in quartz.ts')
              quartz = quartz.replace(anchor, anchor + import_line, 1)
          if register_line not in quartz:
              anchor = 'componentRegistry.register("tag-network-resources", TagNetworkResources, "local")\n'
              if anchor not in quartz:
                  raise SystemExit('Could not locate the local component registration in quartz.ts')
              quartz = quartz.replace(anchor, anchor + register_line, 1)
          quartz_path.write_text(quartz, encoding='utf-8')
          PY

      - name: Add the initial atlas screenshot
        env:
          SCREENSHOT_URL: https://drive.google.com/uc?export=download&id=1Q5HfQillMmOdhNINjxJs_V66aSZ5yd9-
          SCREENSHOT_SHA256: 881525c3c2a547a5a4610e5d34bc2cb2dc5522157fda3e6528d4b9379c76c5f6
        run: |
          set -euo pipefail
          mkdir -p quartz/static/interactive-maps
          screenshot=quartz/static/interactive-maps/dutch-population-relocation-networks.webp
          curl --fail --location --retry 5 --retry-all-errors "$SCREENSHOT_URL" --output "$screenshot"
          echo "$SCREENSHOT_SHA256  $screenshot" | sha256sum --check --strict

      - name: Validate the edited content files
        run: |
          set -euo pipefail
          python -m json.tool quartz/static/interactive-maps.json >/dev/null
          grep -q 'data-interactive-maps-root' content/research.md
          grep -q 'interactive-map-images' .pages.yml
          grep -q 'interactive-maps-resources' quartz.ts
          test -s quartz/static/interactive-maps/dutch-population-relocation-networks.webp

      - name: Commit the completed integration
        run: |
          set -euo pipefail
          rm .github/workflows/apply-interactive-maps-patch.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .pages.yml content/research.md quartz.ts quartz/static/interactive-maps/dutch-population-relocation-networks.webp .github/workflows/apply-interactive-maps-patch.yml
          git commit -m "site: add CMS-managed interactive maps gallery"
          git pull --rebase origin v5
          git push origin HEAD:v5
